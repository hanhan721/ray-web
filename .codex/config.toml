# Project-scoped MCP servers for ray-web.
# Codex loads .codex/config.toml only for TRUSTED projects; trust the repo in Codex first.
# Nothing here modifies package.json / pnpm-lock.yaml: `npx -y` fetches packages at launch.

[mcp_servers.shadcn]
# shadcn-vue MCP: browse/search/install registry items.
command = "npx"
args = ["-y", "shadcn-vue@latest", "mcp"]
# Default startup timeout is 10s, too short for the first npx download.
startup_timeout_sec = 120

[mcp_servers.playwright]
# Browser automation, interaction testing, screenshots and UI verification.
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
startup_timeout_sec = 120
